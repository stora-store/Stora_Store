<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">ستورا ستور | Stora Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #111827;
      --gold: #c59b27;
      --gold-dark: #9e791b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    html, body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; max-width: 100%; overflow-x: hidden; }
    
    header { background: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; padding: 10px 15px; gap: 10px; width: 100%; }
    .header-main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
    .logo-box { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .brand-title { font-size: 0.95rem; font-weight: 900; color: var(--primary); line-height: 1.2; }
    .brand-sub { font-size: 0.95rem; color: var(--gold); font-weight: 900; }

    .catalog-container { max-width: 1400px; margin: 20px auto; padding: 0 15px; width: 100%; }
    .section-title-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-right: 4px solid var(--gold); padding-right: 10px; }
    .section-title { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; width: 100%; }

    .card { background: var(--card-bg); border-radius: 14px; border: 1.5px solid var(--border); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
    .card-img-wrap { width: 100%; height: 190px; background: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 0.92rem; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
    .product-id { font-size: 0.72rem; color: #9e791b; font-weight: 800; margin-bottom: 8px; }
    .card-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
    .price-value-green { font-size: 1.1rem; font-weight: 900; color: #059669; }
    .details-btn { background: #1e293b; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 900; font-size: 0.78rem; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-main-row">
      <a class="logo-box" href="#">
        <img src="https://res.cloudinary.com/rh20s5aa/image/upload/v1790702423/PNG_logo.png" alt="Logo" class="logo-img">
        <div>
          <h1 class="brand-title">ستورا ستور</h1>
          <span class="brand-sub">STORA STORE</span>
        </div>
      </a>
    </div>
  </header>

  <main class="catalog-container">
    <div class="section-title-wrap">
      <h2 class="section-title">الأكثر مبيعاً ⭐</h2>
    </div>
    <div class="products-grid" id="productsGrid">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;" id="loadingText">جاري تحميل المنتجات...</p>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB7XZt7O1_7K8g6m8DoJe3XTUOTsSS6aQk",
      authDomain: "stora-store.firebaseapp.com",
      projectId: "stora-store",
      storageBucket: "stora-store.firebasestorage.app",
      messagingSenderId: "1044396348379",
      appId: "1:1044396348379:web:7bea6cfcf2dbfe4fdfcdfe",
      measurementId: "G-6CMZ6GYSQP"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let allProducts = [];

    db.collection("stora_store_products").onSnapshot((snapshot) => {
      allProducts = [];
      snapshot.forEach((doc) => { 
        allProducts.push(doc.data()); 
      });
      renderProducts(allProducts);
    });

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = "";
      if (products.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:30px;">لا توجد منتجات مضافة بعد.</p>';
        return;
      }
      products.forEach((p) => {
        grid.innerHTML += `
          <div class="card">
            <div class="card-img-wrap"><img src="${p.image || 'https://res.cloudinary.com/rh20s5aa/image/upload/v1790702423/PNG_logo.png'}" alt=""></div>
            <div class="card-body">
              <h3 class="product-title">${p.titleAr || p.title}</h3>
              <div class="product-id">ID: ${p.id}</div>
              <div class="card-price-row">
                <span class="price-value-green">${p.price || 0} ج.م</span>
                <button class="details-btn">عرض التفاصيل</button>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
