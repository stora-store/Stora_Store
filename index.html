  <style>
    :root {
      --primary: #111827;
      --gold: #c59b27;
      --gold-dark: #9e791b;
      --gold-light: #fef9ed;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    html, body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
      max-width: 100%;
      overflow-x: hidden;
    }

    [dir="ltr"] body { text-align: left; }
    [dir="rtl"] body { text-align: right; }

    img { -webkit-user-drag: none; user-select: none; pointer-events: auto; }

    .red-announcement-bar {
      background: #dc2626; color: #fff; font-size: 0.78rem; font-weight: 900;
      padding: 6px 10px; text-align: center; overflow: hidden; white-space: nowrap; width: 100%; display: none;
    }
    .red-announcement-bar span { display: inline-block; animation: marquee 16s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    .top-bar {
      background: #0b0f19; color: #cbd5e1; font-size: 0.75rem; padding: 6px 15px;
      text-align: center; border-bottom: 1px solid rgba(197, 155, 39, 0.3); font-weight: 700;
      display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap;
    }

    .install-app-btn {
      background: var(--gold); color: #111827; border: none; padding: 3px 10px; border-radius: 12px;
      font-weight: 900; font-size: 0.7rem; cursor: pointer; display: none; align-items: center; gap: 4px;
      box-shadow: 0 2px 8px rgba(197, 155, 39, 0.4); transition: transform 0.2s;
    }

    header {
      background: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 100;
      display: flex; flex-direction: column; padding: 10px 15px; gap: 10px; width: 100%;
    }
    .header-main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
    .menu-toggle-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--primary); padding: 4px; }
    
    .logo-box { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .brand-text-col { display: flex; flex-direction: column; justify-content: center; gap: 1px; }
    .brand-title { font-size: 0.95rem; font-weight: 900; color: var(--primary); line-height: 1.2; }
    .brand-sub { font-size: 0.95rem; color: var(--gold); font-weight: 900; letter-spacing: 0.5px; line-height: 1.2; }
    
    .header-search-box { width: 100%; position: relative; }
    .header-search-box input {
      width: 100%; padding: 7px 14px; border: 2px solid var(--border); border-radius: 20px; font-size: 0.82rem; outline: none; font-family: 'Cairo';
    }

    .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .cart-btn-top, .lang-btn-top { background: var(--primary); color: #fff; border: none; padding: 5px 10px; border-radius: 15px; font-weight: 800; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .lang-btn-top { background: var(--gold); color: #111827; }

    .catalog-container { max-width: 1400px; margin: 20px auto; padding: 0 15px; width: 100%; }
    .section-title-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-right: 4px solid var(--gold); padding-right: 10px; }
    .section-title { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; width: 100%; }

    .card {
      background: var(--card-bg); border-radius: 14px; border: 1.5px solid var(--border);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative;
    }
    .card-img-wrap { width: 100%; height: 190px; background: #f8fafc; position: relative; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 0.92rem; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
    .product-id { font-size: 0.72rem; color: #9e791b; font-weight: 800; margin-bottom: 8px; }
    .card-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
    .price-value-green { font-size: 1.1rem; font-weight: 900; color: #059669; }
    .
