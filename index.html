<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <title>ستورا ستور | تجهيزات الحمام الفاخرة</title>
  <meta name="description" content="متجر ستورا ستور الرسمي لتجهيزات الحمامات والمطابخ.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1f2937;
      --primary-hover: #111827;
      --gold: #c59b27;
      --gold-dark: #9e791b;
      --gold-light: #fef9ed;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

    .top-bar {
      background-color: #111827; color: #cbd5e1; font-size: 0.85rem; padding: 10px 20px;
      border-bottom: 1px solid rgba(197, 155, 39, 0.3);
    }
    .top-bar-inner {
      max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .contact-links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .contact-item { display: flex; align-items: center; gap: 6px; color: #e2e8f0; text-decoration: none; }
    .policy-link { color: var(--gold); text-decoration: none; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .policy-link:hover { opacity: 0.8; text-decoration: underline; }

    .floating-whatsapp {
      position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px;
      z-index: 2000; text-decoration: none; display: flex; align-items: center; justify-content: center;
      animation: whatsappPulse 2s infinite; border-radius: 50%;
    }
    [dir="ltr"] .floating-whatsapp { left: auto; right: 25px; }
    .floating-whatsapp img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45); transition: transform 0.3s ease; }
    .floating-whatsapp:hover img { transform: scale(1.1); }

    @keyframes whatsappPulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
      70% { box-shadow: 0 0 0 16px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    header { background: #ffffff; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04); position: sticky; top: 0; z-index: 100; }
    .header-container { max-width: 1300px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
    .logo-box { display: flex; align-items: center; gap: 14px; text-decoration: none; cursor: pointer; }
    .logo-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .brand-title { font-size: 1.35rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .brand-sub { font-size: 0.72rem; color: var(--gold-dark); font-weight: 700; }

    .search-box-header { flex: 1; max-width: 360px; position: relative; }
    .search-input { width: 100%; padding: 9px 18px 9px 40px; border: 2px solid var(--border); border-radius: 30px; font-size: 0.9rem; outline: none; transition: all 0.2s; font-family: 'Cairo', sans-serif; }
    .search-input:focus { border-color: var(--gold); }
    .search-icon { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .action-btn { background: transparent; color: var(--primary); border: 2px solid var(--border); padding: 7px 12px; border-radius: 30px; cursor: pointer; font-size: 0.82rem; font-weight: 800; transition: all 0.2s; }
    .action-btn:hover { border-color: var(--gold); background: var(--gold-light); color: var(--gold-dark); }

    .cart-btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .cart-badge { background: var(--gold); color: #111827; border-radius: 50%; padding: 1px 7px; font-size: 0.8rem; font-weight: 800; }

    .hero-banner-wrap { max-width: 1300px; margin: 15px auto 0; padding: 0 20px; }
    .banner-card { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); background: #0f172a; position: relative; }
    .slider-container { position: relative; width: 100%; height: 380px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; }
    .slider-track { display: flex; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
    .slide-item { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; flex-shrink: 0; }
    .slide-item img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.9); }

    .kohler-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%); z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; pointer-events: none; }
    .kohler-top { display: flex; align-items: center; gap: 12px; }
    .kohler-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #fff; }
    .kohler-brand { color: #fff; font-weight: 900; font-size: 1.1rem; }
    .kohler-bottom { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
    .kohler-title { color: #fff; font-size: 1.5rem; font-weight: 900; }
    .kohler-badge-tag { background: var(--gold); color: #111827; padding: 6px 16px; border-radius: 30px; font-weight: 900; font-size: 0.82rem; }

    .master-switch-wrap { max-width: 1300px; margin: 30px auto 0; padding: 0 20px; }
    .master-switch { display: flex; background: #ffffff; border-radius: 20px; padding: 12px; max-width: 1250px; margin: 0 auto 20px; gap: 12px; overflow-x: auto; box-shadow: 0 10px 30px rgba(197, 155, 39, 0.12); border: 2px solid rgba(197, 155, 39, 0.4); }
    .switch-btn { flex: 1; min-width: 120px; padding: 10px; border: 2px solid var(--border); background: #ffffff; border-radius: 14px; font-weight: 800; font-size: 0.8rem; cursor: pointer; color: var(--text-muted); transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
    .switch-btn:hover, .switch-btn.active { background: var(--gold-light); color: var(--gold-dark); border-color: var(--gold); }
    .switch-btn.active { background: linear-gradient(135deg, var(--primary), #111827); color: #fff; }

    .categories-filter-wrap { max-width: 1300px; margin: 15px auto; padding: 0 20px; text-align: center; }
    .section-title { font-size: 1.65rem; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .section-desc { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }

    .filter-pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
    .filter-btn { background: #ffffff; border: 2px solid var(--border); padding: 9px 20px; border-radius: 30px; font-weight: 800; font-size: 0.88rem; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--gold); background: var(--gold-light); color: var(--gold-dark); }

    .catalog-container { max-width: 1300px; margin: 0 auto; padding: 0 20px 40px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }

    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); }
    .card-img-wrapper { position: relative; width: 100%; height: 240px; background: #f1f5f9; cursor: pointer; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .bestseller-badge { position: absolute; top: 10px; right: 10px; background: #f59e0b; color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 800; z-index: 2; }
    .new-badge { position: absolute; top: 10px; right: 10px; background: #3b82f6; color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 800; z-index: 2; }

    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; cursor: pointer; }
    .card-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .price-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .price-value { font-size: 1.2rem; font-weight: 900; color: #059669; }
    .currency { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
    .view-details-btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }

    .admin-modal, .info-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 2500; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.open, .info-modal.open { display: flex; }
    .admin-content, .info-modal-content { background: #ffffff; width: 100%; max-width: 600px; border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); position: relative; max-height: 90vh; overflow-y: auto; }
    .info-modal-close { position: absolute; top: 15px; left: 20px; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }

    .admin-form-group { margin-bottom: 15px; }
    .admin-form-group label { display: block; font-weight: 800; font-size: 0.88rem; color: var(--primary); margin-bottom: 5px; }
    .admin-form-group input, .admin-form-group select, .admin-form-group textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 0.9rem; outline: none; }
    .admin-submit-btn { background: #059669; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 900; font-size: 1rem; cursor: pointer; }

    footer { background-color: #1f2937; color: #cbd5e1; padding: 40px 20px 20px; border-top: 3px solid var(--gold); text-align: center; }
    .footer-bottom { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="header-container">
      <a class="logo-box" ondblclick="openAdminPanelDirect()" title="انقر نقراً مزدوجاً هنا لفتح لوحة الأدمن">
        <img src="https://res.cloudinary.com/rh20s5aa/image/upload/v1789581596/stora_store.png" alt="لوجو ستورا ستور" class="logo-img">
        <div>
          <h1 class="brand-title">ستورا ستور</h1>
          <span class="brand-sub">STORA STORE • BATHROOM LUXURY</span>
        </div>
      </a>
      <div class="search-box-header">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن موديل، مقاس، أو منتج..." oninput="handleSearch()">
      </div>
    </div>
  </header>

  <!-- الأقسام الرئيسية -->
  <div class="master-switch-wrap">
    <div class="master-switch">
      <button class="switch-btn active" onclick="setMainMode('units')">وحدات الحمام</button>
      <button class="switch-btn" onclick="setMainMode('basins')">أحواض ديكور</button>
      <button class="switch-btn" onclick="setMainMode('porcelain')">أحواض بورسلين</button>
      <button class="switch-btn" onclick="setMainMode('showers')">كبائن شاور</button>
      <button class="switch-btn" onclick="setMainMode('toilets')">قواعد تواليت</button>
      <button class="switch-btn" onclick="setMainMode('mirrors')">مرايا ليد</button>
      <button class="switch-btn" onclick="setMainMode('mixers')">خلاطات مياه</button>
      <button class="switch-btn" onclick="setMainMode('accessories')">إكسسوارات</button>
      <button class="switch-btn" onclick="setMainMode('stainless')">أحواض ستانلس</button>
    </div>
  </div>

  <main class="catalog-container">
    <div class="products-grid" id="productsGrid">جاري تحميل المنتجات...</div>
  </main>

  <!-- لوحة الأدمن -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-content">
      <button class="info-modal-close" onclick="closeAdminModal()">&times;</button>
      <h3 style="font-weight: 800; margin-bottom: 15px;">⚙️ لوحة تحكم الأدمن (حفظ تلقائي على GitHub)</h3>
      <div class="admin-form-group">
        <label>القسم المستهدف للإضافة:</label>
        <select id="targetCategory">
          <option value="units">وحدات الحمام (Units)</option>
          <option value="basins">أحواض ديكور (Basins)</option>
          <option value="porcelain">أحواض بورسلين (Porcelain)</option>
          <option value="showers">كبائن شاور (Showers)</option>
          <option value="toilets">قواعد تواليت (Toilets)</option>
          <option value="mirrors">مرايا ليد (Mirrors)</option>
          <option value="mixers">خلاطات مياه (Mixers)</option>
          <option value="accessories">إكسسوارات (Accessories)</option>
          <option value="stainless">أحواض ستانلس (Stainless)</option>
        </select>
      </div>
      <div class="admin-form-group">
        <label>اسم المنتج:</label>
        <input type="text" id="newTitleAr" placeholder="مثال: وحدة حمام فاخرة">
      </div>
      <div class="admin-form-group">
        <label>السعر:</label>
        <input type="number" id="singlePrice" placeholder="5000">
      </div>
      <button class="admin-submit-btn" onclick="saveProductToGitHub()">💾 حفظ ورفع التعديل على GitHub</button>
    </div>
  </div>

  <footer>
    <div class="footer-bottom">ستورا ستور™ 2026 — جميع الحقوق محفوظة</div>
  </footer>

  <script>
    let storeData = { units: [], basins: [], porcelain: [], showers: [], toilets: [], mirrors: [], mixers: [], accessories: [], stainless: [] };
    let mainMode = 'units';
    let searchQuery = '';

    async function loadStoreProducts() {
      try {
        const response = await fetch('products.json');
        storeData = await response.json();
        renderCatalog();
      } catch (error) {
        console.error("فشل تحميل المنتجات:", error);
        document.getElementById('productsGrid').innerText = "حدث خطأ في تحميل ملف المنتجات.";
      }
    }

    function setMainMode(mode) {
      mainMode = mode;
      document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
      if(event && event.currentTarget) event.currentTarget.classList.add('active');
      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById("productsGrid");
      if (!grid) return;
      grid.innerHTML = "";

      let listToDisplay = storeData[mainMode] || [];

      if (searchQuery !== '') {
        const allItems = [...storeData.units, ...storeData.basins, ...storeData.porcelain, ...storeData.showers, ...storeData.toilets, ...storeData.mirrors, ...storeData.mixers, ...storeData.accessories, ...storeData.stainless];
        listToDisplay = allItems.filter(item => item.titleAr && item.titleAr.toLowerCase().includes(searchQuery));
      }

      if (listToDisplay.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">لا توجد منتجات في هذا القسم حالياً</div>`;
        return;
      }

      listToDisplay.forEach(item => {
        const rawPrice = item.price || (item.prices ? item.prices[Object.keys(item.prices)[0]] : 5000);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrapper"><img src="${item.image || 'https://res.cloudinary.com/rh20s5aa/image/upload/v1789581596/stora_store.png'}" alt="${item.titleAr}" class="card-img"></div>
          <div class="card-body">
            <h3 class="product-title">${item.titleAr}</h3>
            <div style="font-size:0.75rem; color:var(--gold-dark); font-weight:800; margin-bottom:6px;">ID: ${item.id || 'N/A'}</div>
            <div class="card-footer">
              <div class="price-container"><span class="price-value">${rawPrice.toLocaleString()}</span> <span class="currency">ج.م</span></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openAdminPanelDirect() {
      const passPrompt = prompt("أدخل كلمة مرور الأدمن:");
      if (passPrompt === 'admin123') {
        document.getElementById('adminModal').classList.add('open');
      } else if (passPrompt !== null) {
        alert("كلمة المرور غير صحيحة!");
      }
    }

    function closeAdminModal() { document.getElementById('adminModal').classList.remove('open'); }

    // دالة الحفظ التلقائي ورفع التعديلات مباشرة إلى مستودع GitHub
    async function saveProductToGitHub() {
      const targetCategory = document.getElementById('targetCategory').value;
      const title = document.getElementById('newTitleAr').value.trim();
      const price = parseFloat(document.getElementById('singlePrice').value) || 2000;

      if (!title) {
        alert("يرجى إدخال اسم المنتج!");
        return;
      }

      const owner = "stora-store"; // حسابك على GitHub
      const repo = "Stora_Store";  // اسم المستودع
      const path = "products.json";
      const token = "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"; // رمز الـ Token الخاص بك[cite: 6]

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

      try {
        const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
        if (!getRes.ok) throw new Error("فشل الاتصال بـ GitHub API");
        
        const fileData = await getRes.json();
        let currentJson = JSON.parse(atob(fileData.content));

        // إضافة المنتج الجديد للقسم المحدد
        if (!currentJson[targetCategory]) currentJson[targetCategory] = [];
        currentJson[targetCategory].unshift({
          id: "MOD-" + Math.floor(Math.random() * 9000 + 1000),
          type: targetCategory.slice(0, -1),
          titleAr: title,
          price: price,
          image: "https://res.cloudinary.com/rh20s5aa/image/upload/v1789581596/stora_store.png"
        });

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Add new product via Admin Panel",
            content: btoa(unescape(encodeURIComponent(JSON.stringify(currentJson, null, 2)))),
            sha: fileData.sha
          })
        });

        if (putRes.ok) {
          alert("تم حفظ ورفع الموديل على كود المستودع في GitHub بنجاح! سيتم تحديث المتجر خلال لحظات.");
          closeAdminModal();
          loadStoreProducts();
        } else {
          alert("فشل الرفع، تأكد من صحة رمز الـ Token.");
        }
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء الاتصال: " + err.message);
      }
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderCatalog();
    }

    window.onload = loadStoreProducts;
  </script>
</body>
</html>
